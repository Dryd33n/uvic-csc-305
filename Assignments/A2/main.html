<!DOCTYPE html>
<html>

<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: radial-gradient(circle at 20% 20%, #1a202f 0%, #0e1320 60%, #080b12 100%);
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}

#gl-canvas {
    display: block;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 12px;
    box-shadow: 0 16px 45px rgba(0, 0, 0, 0.5);
}

#animToggleButton {
    margin: 0;
}

#animToggleButton input[type="button"] {
    border: 0;
    border-radius: 999px;
    padding: 12px 22px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: #0f1525;
    background: linear-gradient(135deg, #79ffe1 0%, #57c5ff 100%);
    cursor: pointer;
    box-shadow: 0 10px 28px rgba(87, 197, 255, 0.35);
    transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease;
}

#animToggleButton input[type="button"]:hover {
    transform: translateY(-1px);
    box-shadow: 0 14px 30px rgba(87, 197, 255, 0.45);
    filter: brightness(1.03);
}

#animToggleButton input[type="button"]:active {
    transform: translateY(0);
    box-shadow: 0 8px 18px rgba(87, 197, 255, 0.32);
}
</style>

<script id="vertex-shader" type="x-shader/x-vertex">#version 300 es

in vec4 vPosition;
in vec3 vNormal;
in vec4 vColor;
in vec2 vTexCoord;

out vec2 fTexCoord;
out vec3 fObjectPos;
out vec3 fObjectNormal;
out vec3 fEyePos;
out vec3 fEyeNormal;


uniform mat4 modelViewMatrix;
uniform mat4 normalMatrix;
uniform mat4 projectionMatrix;

void
main()
{
    gl_Position = projectionMatrix * modelViewMatrix * vPosition;

	fTexCoord = vTexCoord;
    fObjectPos = vPosition.xyz;
    fObjectNormal = normalize(vNormal);
    fEyePos = (modelViewMatrix * vPosition).xyz;
    fEyeNormal = normalize((normalMatrix * vec4(vNormal, 0.0)).xyz);
}
</script>

<script id="fragment-shader" type="x-shader/x-fragment">#version 300 es

precision mediump float;

uniform sampler2D texture1;
uniform sampler2D texture2;
uniform int blendTextures;
uniform vec2 uvTile;
uniform int projectionMode;
uniform vec4 ambientProduct;
uniform vec4 diffuseProduct;
uniform vec4 specularProduct;
uniform vec4 lightPosition;
uniform float shininess;
uniform vec3 moonDirection;
uniform vec4 moonAmbient;
uniform vec4 moonDiffuse;
uniform float fireAttenLinear;
uniform float fireAttenQuadratic;
uniform float time;

in vec2 fTexCoord;
in vec3 fObjectPos;
in vec3 fObjectNormal;
in vec3 fEyePos;
in vec3 fEyeNormal;

layout(location=0) out vec4 fragColor ;

void
main()
{
    vec3 N = normalize(fEyeNormal);
    vec3 toFire = lightPosition.xyz - fEyePos;
    float fireDistance = length(toFire);
    vec3 L = normalize(toFire);
    vec3 V = normalize(-fEyePos);
    vec3 H = normalize(L + V);
    vec3 moonL = normalize(moonDirection);

    float lightDotNormal = max(dot(L, N), 0.0);
    float fireAttenuation = 1.0 / (1.0 + fireAttenLinear * fireDistance + fireAttenQuadratic * fireDistance * fireDistance);
    vec4 diffuse = diffuseProduct * lightDotNormal * fireAttenuation;

    float blinnSpec = pow(max(dot(N, H), 0.0), shininess);
    vec4 specular = specularProduct * blinnSpec * fireAttenuation;
    if (lightDotNormal <= 0.0) {
        specular = vec4(0.0, 0.0, 0.0, 1.0);
    }

    float moonDotNormal = max(dot(moonL, N), 0.0);
    vec4 moonDiffuseTerm = moonDiffuse * moonDotNormal;
    vec4 litColor = ambientProduct * fireAttenuation + diffuse + specular + moonAmbient + moonDiffuseTerm;
    litColor.a = 1.0;

    vec2 baseTexCoord = fTexCoord;
    if (projectionMode == 1) {
        baseTexCoord = fObjectPos.xz;
    } else if (projectionMode == 2) {
        vec3 an = abs(normalize(fObjectNormal));
        if (an.x >= an.y && an.x >= an.z) {
            baseTexCoord = fObjectPos.yz;
        } else if (an.y >= an.x && an.y >= an.z) {
            baseTexCoord = fObjectPos.xz;
        } else {
            baseTexCoord = fObjectPos.xy;
        }
    }
    vec2 tiledTexCoord = baseTexCoord * uvTile;
    vec4 surfaceColor = vec4(1.0, 1.0, 1.0, 1.0);

    if( blendTextures == 1)
    {
        vec4 alphaTextureColor = texture( texture2, tiledTexCoord );
        vec4 blendedTextureColor = mix(texture( texture1, tiledTexCoord ), alphaTextureColor, alphaTextureColor.a);
        surfaceColor = blendedTextureColor;
	}

    vec4 shadedColor = litColor * surfaceColor;

    // Rim term so silhouettes get a glow.
        float edgeGlow = pow(1.0 - max(dot(N, V), 0.0), 2.8);
    // Position-based phase so the glow isn't uniform.
        float wavePhase = fObjectPos.x * 5.5 + fObjectPos.y * 8.5 + fObjectPos.z * 4.0;
    // Animate that pattern over time to get a sort of flickering / pulsing effect
        float glowPulse = 0.5 + 0.5 * sin(wavePhase + time * 6.0);
    // Final glow strength from rim * pulse, scaled so it does not blow out the base shading
        float glowAmt = edgeGlow * glowPulse * 0.38;
    // Warm ember color for the glow
        vec3 glowColor = vec3(1.0, 0.42, 0.08);
    // Add glow on top of the normal color
        shadedColor.rgb += glowColor * glowAmt;

    // Output final color (opaque alpha)
    fragColor = vec4(shadedColor.rgb, 1.0);

}
</script>
